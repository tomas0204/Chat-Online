{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="{% static 'tailwindcss-colors.css' %}?=v26">
  <link rel="stylesheet" type="text/css" href="{% static 'chat.css' %}?=v26">
  <link rel="stylesheet" type="text/css" href="{% static 'user_profile.css' %}?=v2">
  <title>{% block title %}Chat{% endblock %}</title>
</head>

<body data-username="{{ username }}">
  <!-- start: Chat -->
  <section class="chat-section">
    <div class="chat-container">
      <!-- start: Sidebar -->
      <aside class="chat-sidebar">
        <a href="#" class="chat-sidebar-logo">
          <i class="ri-chat-1-fill"></i>
        </a>
        <ul class="chat-sidebar-menu">
          <li class="active"><a href="{% url 'hellochat' %}" data-title="Chats"><i class="ri-chat-3-line"></i></a></li>
          <li><a href="#" data-title="Contacts"><i class="ri-contacts-line"></i></a></li>
          <li><a href="#" data-title="Documents"><i class="ri-folder-line"></i></a></li>
          <li><a href="#" data-title="Settings"><i class="ri-settings-line"></i></a></li>
          <li class="chat-sidebar-profile">
            <button type="button" class="chat-sidebar-profile-toggle">
              <img src="https://as1.ftcdn.net/v2/jpg/03/46/83/96/1000_F_346839683_6nAPzbhpSkIpb8pmAwufkC7c5eD7wYws.jpg"
                alt="">
            </button>
            <ul class="chat-sidebar-profile-dropdown">
              <li><a href="#"><i class="ri-user-line"></i> Profile</a>
              </li>
              <li><a href="#"><i class="ri-logout-box-line"></i> Logout</a></li>
            </ul>
          </li>
        </ul>
      </aside>
      <!-- end: Sidebar -->

      <!-- start: Content -->
      <div class="chat-content">
        <!-- start: user profile -->
        <!-- From Uiverse.io by andrew-demchenk0 -->
        <div class="card">
          <div class="card__img">
            <img src="https://image-assets.aus-2.volcanic.cloud/api/v1/assets/images/67339f3d440ad7ea7c3cc2e915f05032?t=1768527456&webp_fallback=png" alt="banner">
          </div>
          <div class="card__avatar">
            <img src="https://as1.ftcdn.net/v2/jpg/03/46/83/96/1000_F_346839683_6nAPzbhpSkIpb8pmAwufkC7c5eD7wYws.jpg"
              alt="avatar">
          </div>
          <div class="card__title">{{ user_obj.username }}</div>
          <div class="card__subtitle">-------------</div>
          <div class="card__wrapper">
            <button class="card__btn">Change Avatar</button>
            <button class="card__btn card__btn-solid">Change Banner</button>
          </div>
        </div>
        <!-- end: user profile -->
      </div>
      <!-- end: Content -->
    </div>
  </section>
  <!-- end: Chat -->
  <script type="module" src="{% static 'js/user_profile.js' %}?v=11"></script>
</body>

</html>
